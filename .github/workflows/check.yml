name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Test admin protection
        run: |
          node server.js > /tmp/apex-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail http://localhost:8100/health && break || sleep 1
          done
          node check-auth.mjs
